name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          # Use default packages available on Ubuntu 24.04
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex libssl-dev libelf-dev python3 clang lld llvm

      - name: Fix Missing Security Modules
        run: |
          if [ -f "security/Kconfig" ]; then
            sed -i '/baseband-guard/d' security/Kconfig
          fi

      - name: Inject KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Configure Kernel
        run: |
          export ARCH=arm64
          # We no longer need to export CC=clang manually if we use LLVM=1
          
          make gki_defconfig
          echo "CONFIG_KSU=y" >> .config
          make olddefconfig

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          # Use LLVM=1 to tell the kernel to use the installed clang/lld/llvm
          # KBUILD_WERROR=0 ignores the strict warning errors
          make -j$(nproc) LLVM=1 KBUILD_WERROR=0

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel
          path: arch/arm64/boot/Image.gz-dtb
