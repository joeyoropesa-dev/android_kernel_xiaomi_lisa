name: Build Android Kernel

on:
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu libssl-dev libelf-dev python3

      - name: Inject KernelSU-Next
        run: |
          # Use 'next' branch as requested
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Configure Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 1. Verify defconfig exists
          DEFCONFIG="YOUR_DEFCONFIG_NAME" # CHANGE THIS to your filename (e.g., vostro_defconfig)
          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "Error: Config file not found at arch/arm64/configs/$DEFCONFIG"
            echo "Available configs:"
            ls arch/arm64/configs/
            exit 1
          fi

          # 2. Generate initial .config
          make $DEFCONFIG
          
          # 3. Enable KSU and ensure config is valid
          # We use a safer append method here
          echo "CONFIG_KSU=y" >> .config
          make olddefconfig

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Use -j$(nproc) for GitHub's powerful servers
          make -j$(nproc)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel
          path: arch/arm64/boot/Image.gz-dtb # Update this to match your kernel output
