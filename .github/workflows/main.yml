name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Toolchain (Clang 12)
        run: |
          # Install Clang 12 which is stable for 5.4 kernels
          sudo apt-get update
          sudo apt-get install -y clang-12 lld-12 llvm-12
          # Symlink to standard names
          sudo ln -s /usr/bin/clang-12 /usr/bin/clang
          sudo ln -s /usr/bin/lld-12 /usr/bin/ld.lld
          sudo ln -s /usr/bin/llvm-ar-12 /usr/bin/llvm-ar

      - name: Install Build Dependencies
        run: |
          sudo apt-get install -y bc bison build-essential curl flex libssl-dev libelf-dev python3

      - name: Fix Missing Security Modules
        run: |
          if [ -f "security/Kconfig" ]; then
            sed -i '/baseband-guard/d' security/Kconfig
          fi

      - name: Inject KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Configure Kernel
        run: |
          export ARCH=arm64
          # Use Clang for building
          export CC=clang
          
          DEFCONFIG="gki_defconfig"
          make $DEFCONFIG
          echo "CONFIG_KSU=y" >> .config
          make olddefconfig

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export CC=clang
          # KBUILD_WERROR=0 silences the type-mismatch errors
          # LLVM=1 tells the kernel to use Clang tools instead of GCC
          make -j$(nproc) KBUILD_WERROR=0 LLVM=1

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel
          path: arch/arm64/boot/Image.gz-dtb
