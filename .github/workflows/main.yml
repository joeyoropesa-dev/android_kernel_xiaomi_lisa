name: Build Android Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive # CRITICAL: This fixes missing files/submodules

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu libssl-dev libelf-dev python3

      # If the build still fails with "can't open file", this step removes the broken reference
      - name: Fix Missing Security Modules
        run: |
          if [ -f "security/Kconfig" ]; then
            sed -i '/baseband-guard/d' security/Kconfig
          fi

      - name: Inject KernelSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Configure Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Use gki_defconfig as verified by your directory list
          DEFCONFIG="gki_defconfig"
          
          make $DEFCONFIG
          echo "CONFIG_KSU=y" >> .config
          make olddefconfig

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel
          path: arch/arm64/boot/Image.gz-dtb
